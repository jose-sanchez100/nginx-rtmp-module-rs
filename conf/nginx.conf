# Same syntax as nginx-rtmp-module. The rtmp {} block is read, and from http {}
# only the servers that use rtmp_stat / rtmp_control (see the end of the file).
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # RTMPS clients (not in nginx-rtmp; certificate paths relative to the prefix):
        # listen 1936 ssl;
        # ssl_certificate     conf/cert.pem;
        # ssl_certificate_key conf/key.pem;

        application live {
            live on;
            # allow publish 127.0.0.1;
            # deny publish all;
            # allow play all;

            # Relay (ngx_rtmp_relay_module):
            # push rtmp://backup.example.com/live;          # re-publish everything
            # push rtmp://a.rtmp.youtube.com/live2/KEY name=main;
            # push rtmps://live-api-s.facebook.com:443/rtmp/;  # RTMPS, no stunnel needed
            # push_reconnect 3s;

            # External programs (ngx_rtmp_exec_module, also on Windows):
            # started when $name is published, killed when it stops.
            # exec ffmpeg -i rtmp://127.0.0.1/live/$name -c copy -f flv rtmp://127.0.0.1/hd/$name 2>>logs/ffmpeg-$name.log;
            # exec_publish_done cmd /c scripts\done.bat $name;

            # Recording to FLV (ngx_rtmp_record_module), one file per publish:
            # record all;
            # record_path recordings;          # relative to the prefix
            # record_unique on;                # name-<unix time>.flv
            # record_suffix -%Y%m%d-%H%M%S.flv; # or a strftime pattern
            # record_max_size 2000M;
            # record all manual;               # only when started through /control
            # exec_record_done ffmpeg -i $path -c copy recordings/$basename.mp4;
            # on_record_done http://127.0.0.1:8080/rtmp/record_done;

            # HTTP callbacks (ngx_rtmp_notify_module): 2xx allows, 3xx
            # redirects (Location = new stream name or rtmp:// URL to relay),
            # anything else closes the connection.
            # on_publish http://127.0.0.1:8080/rtmp/publish;
            # on_play http://127.0.0.1:8080/rtmp/play;
            # on_done http://127.0.0.1:8080/rtmp/done;
            # on_update http://127.0.0.1:8080/rtmp/update;
            # notify_update_timeout 30s;
            # notify_method post;
        }

        # Edge that pulls on demand from an origin:
        # application edge {
        #     live on;
        #     pull rtmp://origin.example.com/live;
        #     # always-on mirror of one stream:
        #     # pull rtmp://origin.example.com/live/cam1 name=cam1 static;
        # }
    }
}

