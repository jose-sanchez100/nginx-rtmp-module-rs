[package]
name = "nginx-rtmp-module-rs"
version = "0.1.0"
edition = "2024"
description = "Rust port of nginx-rtmp-module as a standalone RTMP server"
license = "BSD-2-Clause"
repository = "https://github.com/jose-sanchez100/nginx-rtmp-module-rs"

[lib]
name = "nginx_rtmp"
path = "src/lib.rs"

# Built as nginx.exe so it drops into an nginx folder in place of nginx.
[[bin]]
name = "nginx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
hmac = "0.13.0"
md-5 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
rustls-pki-types = { version = "1.16.0", features = ["std"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
winresource = "0.1.34"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
wry = { version = "0.57.2", default-features = false }

[dev-dependencies]
serde_json = "1.0.154"
